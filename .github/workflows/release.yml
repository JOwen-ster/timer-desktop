name: Desktop builds and releases

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            release=true
          else
            tag="v$(jq -r .version package.json)"
            # Only release if this version doesn't already have a release
            if gh release view "$tag" >/dev/null 2>&1; then
              release=false
            else
              release=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag, release: $release"

      - name: Ensure release exists
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Timers $tag" \
              --notes "Download the build for your platform below. No installers: Windows is a standalone .exe, macOS is a zipped .app (unzip and run), Linux is an AppImage. Windows builds are unsigned; macOS builds use ad-hoc signing and are not notarized, so right-click > Open on first launch. macOS requires version 14.2 or later."
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - name: Linux x64 AppImage
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.14'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop and audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpulse-dev patchelf libfuse2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test timer engine
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --lib

      - name: Build standalone exe (Windows)
        if: runner.os == 'Windows'
        run: bun run tauri build --target ${{ matrix.target }} --no-bundle

      - name: Collect and upload exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          dir="src-tauri/target/${{ matrix.target }}/release"
          exe=$(ls "$dir"/*.exe | head -n 1)
          echo "Found exe: $exe"
          mkdir -p dist
          out="dist/Timers-${tag}-windows-x64.exe"
          cp "$exe" "$out"
          echo "EXE_PATH=$out" >> "$GITHUB_ENV"
          if [[ "${{ needs.prepare.outputs.release }}" == "true" ]]; then
            gh release upload "$tag" "$out" --clobber
          fi

      - name: Upload exe as workflow artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-exe
          path: ${{ env.EXE_PATH }}

      - name: Build .app (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: bun run tauri build --target ${{ matrix.target }} --bundles app

      - name: Zip and upload .app (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app=$(ls -d "$dir"/*.app | head -n 1)
          echo "Found app: $app"
          mkdir -p dist
          out="dist/Timers-${tag}-macos-${{ matrix.arch }}.zip"
          # ditto preserves the bundle structure, symlinks and signature; plain `zip` can break them
          ditto -c -k --sequesterRsrc --keepParent "$app" "$out"
          echo "ZIP_PATH=$out" >> "$GITHUB_ENV"
          if [[ "${{ needs.prepare.outputs.release }}" == "true" ]]; then
            gh release upload "$tag" "$out" --clobber
          fi

      - name: Upload .app zip as workflow artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-app
          path: ${{ env.ZIP_PATH }}

      - name: Build AppImage and upload downloads
        if: runner.os == 'Linux'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ needs.prepare.outputs.release == 'true' && needs.prepare.outputs.tag || '' }}
          releaseName: ${{ needs.prepare.outputs.release == 'true' && format('Timers {0}', needs.prepare.outputs.tag) || '' }}
          commitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
