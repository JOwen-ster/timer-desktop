name: Desktop builds and releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux x64 AppImage
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true # Required so we can push the generated tag back to repo

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.14'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Automatically create and push a new tag based on package.json version if one doesn't exist
      - name: Create and push automated tag
        if: runner.os == 'Windows' # Run this step on only one job to avoid race conditions
        run: |
          # Read version from package.json (adjust path if needed)
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tagName = "v$version"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if (-not (git rev-parse $tagName -ErrorAction SilentlyContinue)) {
            git tag $tagName
            git push origin $tagName
            Write-Host "Created and pushed new tag: $tagName"
          } else {
            Write-Host "Tag $tagName already exists."
          }

      - name: Install Linux desktop and audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpulse-dev patchelf libfuse2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test timer engine
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --lib

      - name: Build installers and upload downloads
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          releaseName: 'Timers v__VERSION__' # Tauri action automatically substitutes version
          releaseBody: 'Download the installer for your platform below. Windows builds are unsigned; macOS builds use ad-hoc signing.'
          releaseDraft: false # Makes the release public immediately
          prerelease: false
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
