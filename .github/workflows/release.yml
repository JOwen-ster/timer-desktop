steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0 # Fetches all history and tags so git knows what exists

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.14'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Automatically create and push a new tag based on package.json version if one doesn't exist
      - name: Create and push automated tag
        if: runner.os == 'Windows'
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tagName = "v$version"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if tag exists locally or remotely safely
          $tagExists = git tag --list $tagName
          if (-not $tagExists) {
              Write-Host "Creating new tag: $tagName"
              git tag $tagName
              git push origin $tagName
          } else {
              Write-Host "Tag $tagName already exists. Skipping tag creation."
          }
