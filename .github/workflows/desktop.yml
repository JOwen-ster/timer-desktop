name: Desktop checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop and audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpulse-dev
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked --features tauri/custom-protocol
